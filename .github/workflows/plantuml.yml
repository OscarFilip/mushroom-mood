name: Render PlantUML

on:
  push:
    branches:
      - main
    paths:
      # Only PlantUML source changes should retrigger rendering.
      - 'docs/uml/**/*.puml'
      - '.github/workflows/plantuml.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render PlantUML diagrams to SVG
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t diagrams < <(find docs/uml -type f -name '*.puml' ! -path 'docs/uml/out/*' | sort)

          if [ "${#diagrams[@]}" -eq 0 ]; then
            echo "No PlantUML files found in docs/uml" >&2
            exit 1
          fi

          mkdir -p docs/uml/out
          find docs/uml/out -type f -name '*.svg' -delete

          for diagram in "${diagrams[@]}"; do
            relative="${diagram#docs/uml/}"
            subdir="$(dirname "$relative")"
            output_dir="docs/uml/out/$subdir"
            relative_output="$(realpath --relative-to="$(dirname "$diagram")" "$output_dir")"

            mkdir -p "$output_dir"

            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              plantuml/plantuml:latest \
              -failfast2 \
              -tsvg \
              -o "$relative_output" \
              "/workspace/$diagram"
          done

      - name: Create PR for rendered SVGs when changed
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: docs/uml/out
          branch: chore/render-plantuml-svgs
          commit-message: "docs: update PlantUML SVGs [skip plantuml]"
          title: "docs: update PlantUML SVGs"
          body: |
            Regenerated PlantUML SVG outputs for updated diagrams.
          delete-branch: true
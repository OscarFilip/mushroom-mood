<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Next.js authentication flow</title>
  <desc id="desc">A simple login flow from user to login page, API route, auth service, session store, and back to the user.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937" />
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .lane { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .label { font: 13px Arial, sans-serif; fill: #111827; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
      .store { fill: #ecfeff; stroke: #0f766e; stroke-width: 1.5; }
      .life { stroke: #94a3b8; stroke-dasharray: 6 6; }
      .call { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .reply { stroke: #475569; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="40" y="36" class="title">Next.js Authentication Flow</text>

  <rect x="40" y="60" width="110" height="42" rx="10" class="box" />
  <rect x="200" y="60" width="170" height="42" rx="10" class="box" />
  <rect x="430" y="60" width="170" height="42" rx="10" class="box" />
  <rect x="660" y="60" width="140" height="42" rx="10" class="box" />
  <rect x="840" y="60" width="100" height="42" rx="10" class="store" />

  <text x="95" y="86" text-anchor="middle" class="lane">User</text>
  <text x="285" y="82" text-anchor="middle" class="lane">Login Page</text>
  <text x="285" y="98" text-anchor="middle" class="label">app/login/page.tsx</text>
  <text x="515" y="82" text-anchor="middle" class="lane">Auth API Route</text>
  <text x="515" y="98" text-anchor="middle" class="label">app/api/auth/login/route.ts</text>
  <text x="730" y="86" text-anchor="middle" class="lane">Auth Service</text>
  <text x="890" y="86" text-anchor="middle" class="lane">Session Store</text>

  <line x1="95" y1="112" x2="95" y2="330" class="life" />
  <line x1="285" y1="112" x2="285" y2="330" class="life" />
  <line x1="515" y1="112" x2="515" y2="330" class="life" />
  <line x1="730" y1="112" x2="730" y2="330" class="life" />
  <line x1="890" y1="112" x2="890" y2="330" class="life" />

  <path d="M 95 145 H 285" class="call" />
  <text x="190" y="137" text-anchor="middle" class="label">Submit email and password</text>

  <path d="M 285 185 H 515" class="call" />
  <text x="400" y="177" text-anchor="middle" class="label">POST /api/auth/login</text>

  <path d="M 515 225 H 730" class="call" />
  <text x="622" y="217" text-anchor="middle" class="label">Validate credentials</text>

  <path d="M 730 265 H 890" class="call" />
  <text x="810" y="257" text-anchor="middle" class="label">Create session</text>

  <path d="M 890 290 H 730" class="reply" />
  <text x="810" y="306" text-anchor="middle" class="label">Session ID</text>

  <path d="M 730 315 H 515" class="reply" />
  <text x="622" y="331" text-anchor="middle" class="label">Auth result and session cookie</text>

  <path d="M 515 145 H 285" class="reply" />
  <text x="400" y="161" text-anchor="middle" class="label">200 OK</text>

  <path d="M 285 225 H 95" class="reply" />
  <text x="190" y="241" text-anchor="middle" class="label">Redirect to dashboard</text>
</svg>